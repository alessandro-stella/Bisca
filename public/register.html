<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration</title>

    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="styles/login_register.css" />

    <script
      src="https://kit.fontawesome.com/df57a58519.js"
      crossorigin="anonymous"
    ></script>

    <script>
      async function checkSession() {
        const response = await fetch("/api/session/me", {
          method: "GET",
          credentials: "include",
        });

        if (response.ok) {
          console.log("Session OK");
          window.location.replace("/lobbies.html");
        } else {
          console.log("No session or expired");
        }
      }

      checkSession();
    </script>
  </head>
  <body>
    <div id="baseContainer">
      <div id="registerTitle">BISCA.IT</div>

      <div id="registerContainer">
        <form id="registrationForm">
          <div class="inputWithError">
            <div class="inputWithIcon">
              <i class="icon fa-solid fa-user"></i>
              <input
                id="usernameInput"
                type="text"
                required
                minlength="3"
                maxlength="30"
                placeholder="Username"
              />
            </div>
            <div
              id="usernameInputError"
              class="inputError"
              style="display: none"
            >
              Username already taken
            </div>
          </div>

          <div class="inputWithError">
            <div class="inputWithIcon">
              <i class="icon fa-solid fa-envelope"></i>
              <input
                id="emailInput"
                type="email"
                required
                placeholder="Email"
              />
            </div>
            <div id="emailInputError" class="inputError" style="display: none">
              Email already in use
            </div>
          </div>

          <div class="inputWithError">
            <div class="inputWithIcon inputPassword">
              <i class="icon fa-solid fa-lock"></i>
              <input
                id="passwordInput"
                type="password"
                required
                placeholder="Password"
              />
              <div id="showPassword" class="iconContainer">
                <i class="icon fa-solid fa-eye-slash"></i>
              </div>
            </div>
          </div>

          <div class="inputWithError">
            <div class="inputWithIcon inputPassword">
              <i class="icon fa-solid fa-lock"></i>
              <input
                id="repeatedPasswordInput"
                type="password"
                required
                placeholder="Repeat password"
              />
              <div id="showPasswordRepeat" class="iconContainer">
                <i class="icon fa-solid fa-eye-slash"></i>
              </div>
            </div>
            <div
              id="repeatedPasswordInputError"
              class="inputError"
              style="display: none"
            >
              The passwords do not match
            </div>
          </div>

          <button id="registerButton" type="submit">Register</button>
        </form>
      </div>

      <a id="loginLink" href="login.html">Hai già un account? Accedi ora!</a>
    </div>

    <script src="scripts/register.js"></script>
  </body>
</html>
