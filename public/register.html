<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration</title>

    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <form id="registrationForm">
        <div class="inputWithError">
          <div>Username</div>
          <input
            id="usernameInput"
            type="text"
            required
            minlength="3"
            maxlength="30"
            ="Username"
          />
          <div id="usernameInputError" class="inputError" style="display: none">
            Username already taken
          </div>
        </div>

        <div class="inputWithError">
          <div>Email</div>
          <input id="emailInput" type="email" required placeholder="Email" />
          <div id="emailInputError" class="inputError" style="display: none">
            Email already in use
          </div>
        </div>

        <div class="inputWithError">
          <div>Password</div>
          <input
            id="passwordInput"
            type="password"
            required
            placeholder="Password"
          />
        </div>

        <div class="inputWithError">
          <div>Repeat password</div>
          <input
            id="repeatedPasswordInput"
            type="password"
            required
            placeholder="Password"
          />
          <div
            id="repeatedPasswordInputError"
            class="inputError"
            style="display: none"
          >
            The passwords do not match
          </div>
        </div>

        <button type="submit">Register</button>
        <button><a href="login.html">Go to login</a></button>
      </form>
    </div>

    <script src="scripts/register.js"></script>
  </body>
</html>
