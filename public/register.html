<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration</title>

    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />

    <script>
      async function checkSession() {
        const response = await fetch("/api/session/checkSession", {
          method: "GET",
          credentials: "include",
        });

        if (response.ok) {
          console.log("Session OK");
          window.location.replace("/lobbies.html");
        } else {
          console.log("No session or expired");
        }
      }

      checkSession();
    </script>
  </head>
  <body>
    <div class="container">
      <form id="registrationForm">
        <div class="inputWithError">
          <div>Username</div>
          <input
            id="usernameInput"
            type="text"
            required
            minlength="3"
            maxlength="30"
            ="Username"
          />
          <div id="usernameInputError" class="inputError" style="display: none">
            Username already taken
          </div>
        </div>

        <div class="inputWithError">
          <div>Email</div>
          <input id="emailInput" type="email" required placeholder="Email" />
          <div id="emailInputError" class="inputError" style="display: none">
            Email already in use
          </div>
        </div>

        <div class="inputWithError">
          <div>Password</div>
          <input
            id="passwordInput"
            type="password"
            required
            placeholder="Password"
          />
        </div>

        <div class="inputWithError">
          <div>Repeat password</div>
          <input
            id="repeatedPasswordInput"
            type="password"
            required
            placeholder="Password"
          />
          <div
            id="repeatedPasswordInputError"
            class="inputError"
            style="display: none"
          >
            The passwords do not match
          </div>
        </div>

        <button type="submit">Register</button>
      </form>

      <a href="index.html"><button>Home</button></a>
      <a href="login.html"><button>Go to login</button></a>
    </div>

    <script src="scripts/register.js"></script>
  </body>
</html>
