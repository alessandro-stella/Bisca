<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" type="image/x-icon" href="./media/favicon.svg" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#302e2b" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="/media/app/icon-192x192.png" />

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) =>
              console.log("Service Worker registered successfully!", reg),
            )
            .catch((err) =>
              console.error("Error during Service Worker registration:", err),
            );
        });
      }
    </script>

    <title>BISCA | Registrazione</title>

    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/shared-style.css" />
    <link rel="stylesheet" href="styles/login-register.css" />

    <script
      src="https://kit.fontawesome.com/df57a58519.js"
      crossorigin="anonymous"
    ></script>

    <script>
      async function checkSession() {
        const response = await fetch("/api/session/me", {
          method: "GET",
          credentials: "include",
        });

        if (response.ok) {
          window.location.replace("/lobbies.html");
        } else {
          console.log("No session or expired");
        }
      }

      checkSession();
    </script>
  </head>
  <body>
    <div id="baseContainer">
      <a id="registerTitle" href="index.html">
        <img src="./media/logo.svg" alt="STELLA'S" />
        <p>BISCA</p>
      </a>

      <div id="registerContainer">
        <div class="title">Crea il tuo account</div>

        <form id="registrationForm">
          <div class="inputWithError">
            <div id="usernameInputContainer" class="inputWithIcon">
              <i class="icon fa-solid fa-user"></i>
              <input
                id="usernameInput"
                type="text"
                minlength="3"
                maxlength="30"
                placeholder="Username"
                required
                autocomplete="username"
              />
            </div>
            <div id="usernameInputError" class="inputError" hidden></div>
          </div>

          <div class="inputWithError">
            <div id="emailInputContainer" class="inputWithIcon">
              <i class="icon fa-solid fa-envelope"></i>
              <input
                id="emailInput"
                type="email"
                placeholder="Email"
                required
                autocomplete="email"
              />
            </div>
            <div id="emailInputError" class="inputError" hidden></div>
          </div>

          <div class="inputWithError">
            <div
              id="passwordInputContainer"
              class="inputWithIcon inputPassword"
            >
              <i class="icon fa-solid fa-lock"></i>
              <input
                id="passwordInput"
                type="password"
                placeholder="Password"
                required
                autocomplete="new-password"
              />
              <div id="showPassword" class="iconContainer">
                <i class="icon fa-solid fa-eye-slash"></i>
              </div>
            </div>
            <div id="passwordInputError" class="inputError" hidden></div>
          </div>

          <div class="inputWithError">
            <div
              id="confirmedPasswordInputContainer"
              class="inputWithIcon inputPassword"
            >
              <i class="icon fa-solid fa-lock"></i>
              <input
                id="confirmedPasswordInput"
                type="password"
                placeholder="Conferma password"
                required
                autocomplete="new-password"
              />
              <div id="showPasswordConfirm" class="iconContainer">
                <i class="icon fa-solid fa-eye-slash"></i>
              </div>
            </div>
            <div
              id="confirmedPasswordInputError"
              class="inputError"
              hidden
            ></div>
          </div>

          <button id="registerButton" class="primaryButton" type="submit">
            Registrati
          </button>

          <div id="registerSuccess" hidden></div>

          <div id="missingData" class="inputError" hidden>
            Compilare l'intero questionario
          </div>

          <div id="registerGeneralError" class="inputError" hidden></div>
        </form>
      </div>

      <a id="loginLink" href="login.html">Hai già un account? Accedi ora!</a>
    </div>

    <script src="scripts/register.js"></script>
  </body>
</html>
