<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lobbies</title>

    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />

    <script>
      async function checkSession() {
        const response = await fetch("/api/session/me", {
          method: "GET",
          credentials: "include",
        });

        if (response.ok) {
          console.log("Session OK");
        } else {
          console.log("No session or expired");
          window.location.replace("/login.html");
        }
      }

      checkSession();
    </script>
  </head>

  <body>
    <div class="container">
      <h1>Create lobby</h1>
      <input id="lobbyName" type="text" placeholder="Name" />
      <button onclick="createLobby()">Test</button>
    </div>

    <div class="container">
      <button onclick="getLobbies()">Get lobbies</button>
      <ol id="lobbies"></ol>
    </div>

    <div class="container">
      <a href="profile.html"><button>Go to profile</button></a>
    </div>
  </body>
</html>
