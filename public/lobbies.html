<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/x-icon" href="./media/logo.svg" />

    <title>BISCA | Tavoli</title>

    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="styles/lobbies.css" />

    <script src="/socket.io/socket.io.js"></script>
    <script src="scripts/lobbies.js" defer></script>

    <script
      src="https://kit.fontawesome.com/df57a58519.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <div id="navbar">
      <a id="logo" href="index.html">
        <img src="./media/logo.svg" alt="STELLA'S" />
        <p>BISCA</p>
      </a>

      <div class="buttons">
        <a class="primaryButton iconButton" href="profile.html">
          <i class="fa-solid fa-user"></i>
          <p>Profilo</p>
        </a>
      </div>
    </div>

    <div id="backdrop" class=""></div>

    <div id="baseContainer">
      <div id="leftColumn" class="">
        <div id="filterLobbies">
          <div class="title">Filtra tavoli</div>
          <div id="nameFilterInputContainer" class="inputWithIcon">
            <i class="icon fa-solid fa-search"></i>
            <input id="searchInput" type="text" placeholder="Nome" />
          </div>
          <div id="ownerFilterInputContainer" class="inputWithIcon">
            <i class="icon fa-solid fa-search"></i>
            <input id="ownerInput" type="text" placeholder="Creatore" />
          </div>

          <div id="filterButtons">
            <div id="onlyPublic" class="filterButton">Pubblici</div>
            <div id="onlyPrivate" class="filterButton">Privati</div>
            <div id="onlyAccessible" class="filterButton">Accessibili</div>
          </div>

          <button id="applyFilters" class="primaryButton"><p>Filtra</p></button>
        </div>

        <div id="createLobbyContainer">
          <div class="title">Crea tavolo</div>

          <div id="createLobbyInputs">
            <div class="inputWithError">
              <div id="nameInputContainer" class="inputWithIcon">
                <i class="icon fa-solid fa-pencil"></i>
                <input id="nameInput" type="text" required placeholder="Nome" />
              </div>
              <div id="nameInputError" class="inputError" hidden></div>
            </div>

            <div class="inputWithError">
              <div id="playersInputContainer" class="inputWithIcon">
                <i class="icon fa-solid fa-user"></i>
                <input
                  id="playersInput"
                  type="number"
                  required
                  min="2"
                  placeholder="Giocatori"
                />
              </div>
              <div id="playersInputError" class="inputError" hidden></div>
            </div>

            <div id="livesAndCards">
              <div class="inputWithError">
                <div id="livesInputContainer" class="inputWithIcon">
                  <i class="icon fa-solid fa-heart"></i>
                  <input
                    id="livesInput"
                    type="number"
                    required
                    min="1"
                    placeholder="Vite"
                  />
                </div>
                <div id="livesInputError" class="inputError" hidden></div>
              </div>

              <div class="inputWithError">
                <div id="cardsInputContainer" class="inputWithIcon">
                  <i class="icon fa-solid fa-layer-group"></i>
                  <input
                    id="cardsInput"
                    type="number"
                    required
                    min="1"
                    placeholder="Carte"
                  />
                </div>
                <div id="cardsInputError" class="inputError" hidden></div>
              </div>
            </div>

            <div class="inputWithError">
              <div class="inputWithIcon inputPassword">
                <i class="icon fa-solid fa-lock"></i>
                <input
                  id="passwordInput"
                  type="password"
                  required
                  placeholder="Password (vuoto se pubblica)"
                />
                <div id="showPassword" class="iconContainer">
                  <i class="icon fa-solid fa-eye-slash"></i>
                </div>
              </div>

              <div id="loginError" class="inputError" hidden>
                Email o password non valida
              </div>
            </div>
          </div>

          <button id="createLobby" class="primaryButton">
            <p>Crea tavolo</p>
          </button>

          <div id="ownerButtonsContainer" hidden>
            <button id="startLobbyButton" class="primaryButton">
              <p>Avvia partita</p>
            </button>
            <button id="updateLobbyButton" class="secondaryButton">
              <p>Aggiorna valori</p>
            </button>
            <button id="deleteLobbyButton" class="dangerButton">
              <p>Elimina tavolo</p>
            </button>
          </div>
        </div>
      </div>

      <div id="rightColumn">
        <div id="lobbiesContainer">
          <div class="title">
            <p>Tavoli esistenti</p>

            <div id="filterLobbiesPopupButton" class="secondaryButton">
              <i class="icon fa-solid fa-filter"></i>
            </div>
          </div>
          <div id="lobbiesListContainer">
            <table id="lobbiesList">
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>Creatore</th>
                  <th class="mobileHidden">Vite</th>
                  <th class="mobileHidden">Carte</th>
                  <th>Giocatori</th>
                  <th>Stato</th>
                </tr>
              </thead>
              <tbody id="lobbies"></tbody>
            </table>
          </div>
        </div>
        <button id="createLobbyPopupButton" class="primaryButton">
          <p>Crea tavolo</p>
        </button>
      </div>
    </div>
  </body>
</html>
