<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="icon" type="image/x-icon" href="./media/logo.svg" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#302e2b" />

    <link rel="apple-touch-icon" href="/media/app/icon-192x192.png" />

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) =>
              console.log("Service Worker registered successfully!", reg),
            )
            .catch((err) =>
              console.error("Error during Service Worker registration:", err),
            );
        });
      }
    </script>

    <title>BISCA | Profilo</title>

    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="./styles/profile.css" />

    <script src="./scripts/profile.js" defer></script>
    <script
      src="https://kit.fontawesome.com/df57a58519.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <div id="navbar">
      <a id="logo" href="index.html">
        <img src="./media/logo.svg" alt="STELLA'S" />
        <p>BISCA</p>
      </a>

      <div class="buttons">
        <a id="lobbies" class="primaryButton iconButton" href="lobbies.html">
          <i class="fa-solid fa-door-closed"></i>
          <p>Tavoli</p>
        </a>

        <button
          id="logout"
          class="secondaryButton iconButton"
          onclick="logout()"
        >
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
          <p>Esci</p>
        </button>
      </div>
    </div>

    <div id="baseContainer">
      <div id="userInfo">
        <div id="usernameInfo"></div>
        <div id="emailInfo"></div>
        <div id="eloInfo"></div>
        <div id="winRate"></div>
      </div>

      <div id="matchHistoryContainer">
        <div id="totalMatches"></div>

        <table id="matchHistory">
          <thead>
            <tr>
              <th>Data</th>
              <th>Posizionamento</th>
              <th>Elo</th>
              <th>Avversari</th>
              <th>Turni</th>
            </tr>
          </thead>
          <tbody id="matchHistoryBody"></tbody>
        </table>
      </div>
    </div>
  </body>
</html>
