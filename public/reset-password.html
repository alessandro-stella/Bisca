<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" type="image/x-icon" href="./media/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#302e2b" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="/media/app/icon-192x192.png" />

    <title>BISCA | Cambio Password</title>

    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="styles/login_register.css" />
    <link rel="stylesheet" href="styles/reset-password.css" />

    <script
      src="https://kit.fontawesome.com/df57a58519.js"
      crossorigin="anonymous"
    ></script>

    <script>
      async function checkSession() {
        const response = await fetch("/api/session/me", {
          method: "GET",
          credentials: "include",
        });
        if (response.ok) {
          window.location.replace("/lobbies.html");
        }
      }
      checkSession();
    </script>

    <script src="scripts/reset-password.js" defer></script>
  </head>
  <body>
    <div id="baseContainer">
      <a id="loginTitle" href="index.html">
        <img src="./media/logo.svg" alt="Logo" />
        <p>BISCA</p>
      </a>

      <div id="resetPasswordContainer">
        <div id="loadingState" class="state">
          <i class="fa-solid fa-spinner fa-spin"></i>
          Verifica in corso...
        </div>

        <form id="resetPasswordForm" hidden>
          <div class="inputWithError">
            <div
              id="passwordInputContainer"
              class="inputWithIcon inputPassword"
            >
              <i class="icon fa-solid fa-lock"></i>
              <input
                id="passwordInput"
                type="password"
                placeholder="Password"
                required
                autocomplete="new-password"
              />
              <div id="showPassword" class="iconContainer">
                <i class="icon fa-solid fa-eye-slash"></i>
              </div>
            </div>
            <div id="passwordInputError" class="inputError" hidden></div>
          </div>

          <div class="inputWithError">
            <div
              id="confirmedPasswordInputContainer"
              class="inputWithIcon inputPassword"
            >
              <i class="icon fa-solid fa-lock"></i>
              <input
                id="confirmedPasswordInput"
                type="password"
                placeholder="Conferma password"
                required
                autocomplete="new-password"
              />
              <div id="showPasswordConfirm" class="iconContainer">
                <i class="icon fa-solid fa-eye-slash"></i>
              </div>
            </div>
            <div
              id="confirmedPasswordInputError"
              class="inputError"
              hidden
            ></div>
          </div>

          <button id="resetButton" class="primaryButton" type="submit">
            Cambia password
          </button>
        </form>

        <div id="successState" class="state" hidden>
          <i class="fa-solid fa-check-circle success"></i>
          Password cambiata!
          <span>La tua password è stata salvata con successo.</span>
          <div class="actions">
            <a href="login.html" class="primaryButton">Accedi ora</a>
          </div>
        </div>

        <div id="errorState" class="state" hidden>
          <i class="fa-solid fa-times-circle error"></i>
          <span id="errorMessage">Si è verificato un errore</span>
          <div class="actions">
            <a href="forgot-password.html" class="primaryButton">
              Richiedi un nuovo link
            </a>
          </div>
        </div>

        <div id="invalidTokenState" class="state" hidden>
          <i class="fa-solid fa-exclamation-circle warning"></i>
          Link non valido o scaduto
          <span>I link scadono dopo 15 minuti</span>
          <div class="actions">
            <a href="forgot-password.html" class="primaryButton">
              Richiedi un nuovo link
            </a>
          </div>
        </div>
      </div>

      <a href="login.html" id="backToLogin">Torna al login</a>
    </div>
  </body>
</html>
