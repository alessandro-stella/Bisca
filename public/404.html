<!doctype html>
<html lang="en">
  <head>
    <!-- Charset and Viewport -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- SEO: Prevent indexing of this error page -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Icons: SVG for browser tab, PNGs for PWA -->
    <link rel="icon" type="image/svg+xml" href="./media/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/media/app/icon-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/media/app/icon-512x512.png"
    />
    <link rel="apple-touch-icon" href="/media/app/icon-192x192.png" />

    <!-- PWA Manifest and Theme settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#302e2b" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Service Worker Registration -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) =>
              console.log("Service Worker registered successfully!", reg),
            )
            .catch((err) =>
              console.error("Error during Service Worker registration:", err),
            );
        });
      }
    </script>

    <!-- Page Title -->
    <title>BISCA | Pagina non trovata</title>

    <!-- Stylesheets and External Scripts -->
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/shared-style.css" />
    <link rel="stylesheet" href="./styles/404.css" />
    <script
      src="https://kit.fontawesome.com/df57a58519.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <main id="baseContainer">
      <section id="notFound">
        <div class="code">404</div>
        <h1 class="title">Pagina non trovata</h1>
        <div class="text">
          Ops! Sembra che tu abbia sbagliato carta: la pagina che stai cercando
          non esiste o è stata spostata.
        </div>

        <div class="buttons">
          <a href="index.html" class="primaryButton iconButton">
            <i class="fa-solid fa-house"></i>
            <p>Torna alla home</p>
          </a>

          <a id="authButton" href="#" class="primaryButton iconButton">
            <span id="loadingIcon"
              ><i class="fa-solid fa-spinner fa-spin"></i
            ></span>

            <span id="profileIcon" hidden>
              <i class="fa-solid fa-user"></i
            ></span>

            <span id="loginIcon" hidden>
              <i class="fa-solid fa-right-to-bracket"></i>
            </span>

            <p id="authText">Caricamento...</p>
          </a>
        </div>
      </section>
    </main>

    <script>
      async function checkSession() {
        const authButton = document.getElementById("authButton");
        const loadingIcon = document.getElementById("loadingIcon");
        const profileIcon = document.getElementById("profileIcon");
        const loginIcon = document.getElementById("loginIcon");
        const authText = document.getElementById("authText");

        const setLoggedOutState = () => {
          console.log("Settings logged out");
          console.log(loadingIcon, loginIcon);

          loadingIcon.hidden = true;
          loginIcon.hidden = false;
          authButton.href = "login.html";
          authText.textContent = "Accedi ora";
        };

        const setLoggedInState = () => {
          console.log("Settings logged in");
          console.log(loadingIcon, profileIcon);
          loadingIcon.hidden = true;
          profileIcon.hidden = false;
          authButton.href = "profile.html";
          authText.textContent = "Vai al profilo";
        };

        try {
          const response = await fetch("/api/session/me", {
            method: "GET",
            credentials: "include",
          });

          if (!response.ok) {
            setLoggedOutState();
            return;
          }

          const data = await response.json();
          if (!data.user) {
            setLoggedOutState();
            return;
          }

          setLoggedInState();
        } catch (error) {
          console.error("Error fetching session:", error);
          setLoggedOutState();
        }
      }

      checkSession();
    </script>
  </body>
</html>
