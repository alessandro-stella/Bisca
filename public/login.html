<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="./media/logo.svg" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#302e2b" />

    <link rel="apple-touch-icon" href="/media/app/icon-192x192.png" />

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) =>
              console.log("Service Worker registered successfully!", reg),
            )
            .catch((err) =>
              console.error("Error during Service Worker registration:", err),
            );
        });
      }
    </script>

    <title>BISCA | Accesso</title>

    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="styles/login_register.css" />

    <script
      src="https://kit.fontawesome.com/df57a58519.js"
      crossorigin="anonymous"
    ></script>

    <script>
      async function checkSession() {
        const response = await fetch("/api/session/me", {
          method: "GET",
          credentials: "include",
        });

        if (response.ok) {
          window.location.replace("/lobbies.html");
        } else {
          console.log("No session or expired");
        }
      }

      checkSession();
    </script>
  </head>
  <body>
    <div id="baseContainer">
      <a id="loginTitle" href="index.html">
        <img src="./media/logo.svg" alt="STELLA'S" />
        <p>BISCA</p>
      </a>

      <div id="loginContainer">
        <form id="loginForm">
          <div class="inputWithIcon">
            <i class="icon fa-solid fa-user"></i>
            <input id="emailInput" type="email" required placeholder="Email" />
          </div>

          <div class="inputWithError">
            <div class="inputWithIcon inputPassword">
              <i class="icon fa-solid fa-lock"></i>
              <input
                id="passwordInput"
                type="password"
                required
                placeholder="Password"
              />
              <div id="showPassword" class="iconContainer">
                <i class="icon fa-solid fa-eye-slash"></i>
              </div>
            </div>

            <div id="loginError" class="inputError" hidden>
              Email o password non valida
            </div>
          </div>

          <button id="loginButton" class="primaryButton" type="submit">
            Accedi
          </button>
        </form>
      </div>

      <a id="registerLink" href="register.html"
        >Nuovo giocatore? Registrati ora!</a
      >
    </div>

    <script src="scripts/login.js"></script>
  </body>
</html>
