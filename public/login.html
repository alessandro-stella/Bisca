<!doctype html>
<html lang="en">
  <head>
    <!-- Charset and Viewport -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- SEO: Meta Description and Open Graph -->
    <meta
      name="description"
      content="Accedi al tuo account Bisca per sederti ai tavoli, sfidare altri giocatori e continuare la tua scalata verso la vetta della classifica."
    />
    <meta property="og:site_name" content="Bisca" />
    <meta property="og:title" content="Bisca Online | Accesso" />

    <!-- SEO: Dynamic JSON-LD for Google Search -->
    <script>
      const schema = {
        "@context": "https://schema.org",
        "@type": "WebSite",
        name: "Bisca",
        url: window.location.origin + "/",
      };
      const script = document.createElement("script");
      script.type = "application/ld+json";
      script.text = JSON.stringify(schema);
      document.head.appendChild(script);
    </script>

    <!-- Icons: SVG for browser tab, PNGs for Google Search and PWA -->
    <link rel="icon" type="image/svg+xml" href="./media/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/media/app/icon-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/media/app/icon-512x512.png"
    />
    <link rel="apple-touch-icon" href="/media/app/icon-192x192.png" />

    <!-- PWA Manifest and Theme settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#302e2b" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Service Worker Registration -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) =>
              console.log("Service Worker registered successfully!", reg),
            )
            .catch((err) =>
              console.error("Error during Service Worker registration:", err),
            );
        });
      }
    </script>

    <!-- Page Title -->
    <title>BISCA | Accesso</title>

    <!-- Stylesheets and External Scripts -->
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/shared-style.css" />
    <link rel="stylesheet" href="styles/login-register.css" />
    <script
      src="https://kit.fontawesome.com/df57a58519.js"
      crossorigin="anonymous"
    ></script>

    <!-- Session Management -->
    <script>
      async function checkSession() {
        const response = await fetch("/api/session/me", {
          method: "GET",
          credentials: "include",
        });
        if (response.ok) {
          window.location.replace("/lobbies.html");
        } else {
          console.log("No session or expired");
        }
      }
      checkSession();
    </script>
    <script src="scripts/login.js" defer></script>
  </head>

  <body>
    <main id="baseContainer">
      <a id="loginTitle" href="index.html">
        <img src="./media/logo.svg" alt="STELLA'S" />
        <p>BISCA</p>
      </a>

      <section id="loginContainer">
        <h1 class="title">Accedi al tuo account</h1>

        <form id="loginForm">
          <div class="inputWithIcon">
            <i class="icon fa-solid fa-envelope"></i>
            <input id="emailInput" type="email" required placeholder="Email" />
          </div>

          <div class="inputWithError">
            <div class="inputWithIcon inputPassword">
              <i class="icon fa-solid fa-lock"></i>
              <input
                id="passwordInput"
                type="password"
                required
                placeholder="Password"
              />
              <div id="showPassword" class="iconContainer">
                <i class="icon fa-solid fa-eye-slash"></i>
              </div>
            </div>

            <div id="textUnderPassword">
              <div id="loginError" class="inputError" hidden>
                Email o password non valida
              </div>

              <a
                id="forgotPasswordLink"
                href="forgot-password.html"
                class="forgotPasswordLink"
              >
                Password dimenticata?
              </a>
            </div>
          </div>

          <button id="loginButton" class="primaryButton" type="submit">
            Accedi
          </button>
        </form>
      </section>

      <a id="registerLink" href="register.html"
        >Nuovo giocatore? Registrati ora!</a
      >
    </main>
  </body>
</html>
