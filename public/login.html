<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />

    <script>
      async function checkSession() {
        const response = await fetch("/api/session/checkSession", {
          method: "GET",
          credentials: "include",
        });

        if (response.ok) {
          console.log("Session OK");
          window.location.replace("/lobbies.html");
        } else {
          console.log("No session or expired");
        }
      }

      checkSession();
    </script>
  </head>
  <body>
    <div class="container">
      <form id="loginForm">
        <div class="inputWithError">
          <div>Email</div>
          <input id="emailInput" type="email" required placeholder="Email" />
        </div>

        <div class="inputWithError">
          <div>Password</div>
          <input
            id="passwordInput"
            type="password"
            required
            placeholder="Password"
          />
        </div>

        <div id="loginError" style="display: none">
          Invalid email or password
        </div>

        <button type="submit">Login</button>
      </form>

      <a href="index.html"><button>Home</button></a>
      <a href="register.html"><button>Go to registration</button></a>
    </div>

    <script src="scripts/login.js"></script>
  </body>
</html>
