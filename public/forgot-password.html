<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" type="image/x-icon" href="./media/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#302e2b" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="/media/app/icon-192x192.png" />

    <title>BISCA | Reset Password</title>

    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/shared-style.css" />
    <link rel="stylesheet" href="styles/login-register.css" />
    <link rel="stylesheet" href="styles/forgot-password.css" />

    <script
      src="https://kit.fontawesome.com/df57a58519.js"
      crossorigin="anonymous"
    ></script>

    <script>
      async function checkSession() {
        const response = await fetch("/api/session/me", {
          method: "GET",
          credentials: "include",
        });
        if (response.ok) {
          window.location.replace("/lobbies.html");
        }
      }
      checkSession();
    </script>

    <script src="scripts/forgot-password.js" defer></script>
  </head>
  <body>
    <div id="baseContainer">
      <a id="loginTitle" href="index.html">
        <img src="./media/logo.svg" alt="Logo" />
        <p>BISCA</p>
      </a>

      <div id="forgotPasswordContainer">
        <form id="forgotPasswordForm">
          <div class="title">Password dimenticata?</div>

          <div id="emailContainer" class="inputWithIcon">
            <i class="icon fa-solid fa-envelope"></i>
            <input
              id="emailInput"
              type="email"
              required
              placeholder="Il tuo indirizzo email"
            />
          </div>

          <div id="emailError" class="inputError" hidden></div>

          <button id="submitButton" class="primaryButton" type="submit">
            Invia link di recupero
          </button>
        </form>

        <div id="loadingState" class="state" hidden>
          <i class="fa-solid fa-spinner fa-spin"></i>
          Invio link in corso...
        </div>

        <div id="successState" class="state" hidden>
          <i class="fa-solid fa-check-circle success"></i>
          Email inviata!
          <span
            >Controlla la tua email (e la cartella Spam) per il link di
            reset.</span
          >
        </div>

        <div id="errorState" class="state" hidden>
          <i class="fa-solid fa-times-circle error"></i>
          <span id="errorMessage">Si è verificato un errore</span>
          <button id="retryButton" type="button" class="secondaryButton">
            Riprova
          </button>
        </div>
      </div>

      <a href="login.html" id="backToLogin">Torna al login</a>
    </div>
  </body>
</html>
