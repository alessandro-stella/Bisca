<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" type="image/x-icon" href="./media/favicon.svg" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#302e2b" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="/media/app/icon-192x192.png" />

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) =>
              console.log("Service Worker registered successfully!", reg),
            )
            .catch((err) =>
              console.error("Error during Service Worker registration:", err),
            );
        });
      }
    </script>

    <title>BISCA | Partita</title>

    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="styles/game.css" />

    <script src="/socket.io/socket.io.js" defer></script>
    <script src="/scripts/game.js" defer></script>

    <script
      src="https://kit.fontawesome.com/df57a58519.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <div id="baseContainer">
      <div id="loadingCover" hidden>
        <i class="fa-solid fa-spinner"></i>
      </div>

      <div id="endGameBackdrop" hidden>
        <div id="endGamePopup">
          <div class="title"></div>

          <div id="scoreboard"></div>

          <div id="buttons">
            <a href="lobbies.html">
              <button id="backToLobbies" class="primaryButton">
                <p>Torna ai tavoli</p>
              </button>
            </a>

            <a href="profile.html">
              <button id="profile" class="primaryButton">
                <p>Il tuo profilo</p>
              </button>
            </a>
          </div>
        </div>
      </div>

      <div id="tableContainer">
        <div id="topButtons">
          <button id="openChat" class="primaryButton">
            <i class="fa-solid fa-comments"></i>
          </button>

          <div id="logo" href="index.html">
            <img src="./media/logo.svg" alt="STELLA'S" />
            <p>BISCA</p>
          </div>

          <a href="lobbies.html">
            <button id="quitLobby" class="dangerButton">
              <i class="fa-solid fa-arrow-right-from-bracket"></i></button
          ></a>
        </div>

        <div id="table-rim">
          <div id="table"></div>
        </div>
      </div>

      <div id="mySeat">
        <div id="middleContainer">
          <div id="myStats">
            <div id="myUsername"></div>
            <div id="myLives">
              <i class="fa-solid fa-heart"></i>
              <div class="value"></div>
            </div>
            <div id="myBids">
              <div class="bidsIcon"></div>
              <div class="value"></div>
            </div>
          </div>

          <div id="bottom">
            <button id="bottomButton" class="secondaryButton disabled" hidden>
              <p>Attendi il tuo turno</p>
            </button>
          </div>
        </div>

        <div id="myCards"></div>

        <div id="chatContainer">
          <button id="expandChat" class="secondaryButton">
            <i class="fa-solid fa-angle-up"></i>
            <i class="fa-solid fa-xmark"></i>
          </button>

          <div id="oldMessages"></div>

          <div id="newMessageContainer">
            <input type="text" id="messageContent" />
            <button id="sendMessage" class="primaryButton">
              <i class="fa-solid fa-paper-plane"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
