<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" type="image/x-icon" href="./media/favicon.svg" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#302e2b" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="/media/app/icon-192x192.png" />

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) =>
              console.log("Service Worker registered successfully!", reg),
            )
            .catch((err) =>
              console.error("Error during Service Worker registration:", err),
            );
        });
      }
    </script>

    <title>BISCA | Partita</title>

    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="styles/game.css" />

    <script src="/socket.io/socket.io.js" defer></script>
    <script src="/scripts/game.js" defer></script>

    <script
      src="https://kit.fontawesome.com/df57a58519.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <div id="baseContainer">
      <div id="loadingCover">
        <i class="fa-solid fa-spinner"></i>
      </div>

      <div id="backdrop" class="">
        <div id="bidPopup">
          <div class="title">Quante mani vincerai?</div>
          <div id="bidsContainer"></div>
          <button id="closePopup" class="secondaryButton">
            <p>Indietro</p>
          </button>
        </div>
      </div>

      <div id="tableContainer">
        <div id="topButtons">
          <button id="openChat" class="primaryButton">
            <i class="fa-solid fa-comments"></i>
          </button>

          <button id="quitLobby" class="dangerButton">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </button>
        </div>
        <div id="table"></div>
      </div>

      <div id="mySeat">
        <div id="myCards"></div>
        <div id="myStats">
          <div id="myUsername"></div>
          <div id="myLives">
            <i class="fa-solid fa-heart"></i>
            <div class="value"></div>
          </div>
          <div id="myBids">
            <div class="bidsIcon"></div>
            <div class="value"></div>
          </div>
        </div>

        <button id="bottomButton" class="secondaryButton disabled">
          <p>Attendi il tuo turno</p>
        </button>
      </div>
    </div>
  </body>
</html>
