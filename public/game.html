<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" type="image/x-icon" href="./media/favicon.svg" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#302e2b" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="/media/app/icon-192x192.png" />

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) =>
              console.log("Service Worker registered successfully!", reg),
            )
            .catch((err) =>
              console.error("Error during Service Worker registration:", err),
            );
        });
      }
    </script>

    <title>BISCA | Partita</title>

    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="styles/game.css" />

    <script src="/socket.io/socket.io.js" defer></script>
    <script src="/scripts/game.js" defer></script>
  </head>

  <body>
    <div class="container">
      <h1>Partita</h1>

      <p id="gameStatus">Connecting to the game...</p>

      <p id="currentPlayer">Turn: ...</p>

      <p id="myUsername"></p>
    </div>

    <div class="container">
      <div id="livesContainer"></div>
    </div>

    <div class="container">
      <div id="cardsTitle">Le mie carte</div>
      <div id="myCardsContainer" class="cardsContainer"></div>
    </div>

    <div class="container">
      <div>Carte giocate</div>
      <div id="playedCardsContainer" class="cardsContainer"></div>
    </div>

    <div class="container">
      <div id="bidButtonsContainer"></div>
    </div>
  </body>
</html>
